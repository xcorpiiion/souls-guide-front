# Resolver do Docker. Sem ele, o nginx resolve os nomes dos containers uma única vez na
# subida e morre com "host not found in upstream" se o gateway ainda não existir —
# exatamente o que acontece quando a máquina reinicia e todos os containers voltam juntos.
# Com resolver + variável no proxy_pass, o nome é resolvido a cada requisição.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload de imagem passa por aqui; o padrão do nginx (1MB) recusaria print de jogo.
    client_max_body_size 25m;

    # ── Proxy das APIs ──────────────────────────────────────────────────────────
    # O front chama /souls-guide-api/... em vez de http://localhost:8765/souls-guide-api/...
    # justamente para que quem serve o HTML também sirva a API: mesma origem, sem CORS,
    # e o mesmo build funciona em localhost, no IP da LAN e na URL do túnel.
    #
    # O `^~` não é enfeite: sem ele o nginx ainda avalia as regex depois do prefixo, e a
    # regex de cache de assets lá embaixo casa qualquer caminho terminado em .webp/.png —
    # inclusive a URL assinada de upload. O PUT caía no handler de arquivo estático, que
    # só aceita GET/HEAD, e voltava 405 sem nunca chegar na storage-api.
    location ^~ /souls-guide-api/  { set $gw http://gateway-api:8765; proxy_pass $gw$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }
    location ^~ /authorization-api/ { set $gw http://gateway-api:8765; proxy_pass $gw$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }
    location ^~ /user-api/          { set $gw http://gateway-api:8765; proxy_pass $gw$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }
    location ^~ /storage-api/       { set $gw http://gateway-api:8765; proxy_pass $gw$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }

    # O sitemap.xml é gerado pelo souls-guide-api, a partir do conteúdo publicado, mas o
    # buscador só o procura na raiz do domínio — e é o domínio do front que ele conhece.
    # `=` tem prioridade máxima, então isto ganha do try_files do SPA sem ambiguidade.
    #
    # O robots.txt, ao lado dele, é estático e sai de public/ pelo próprio try_files.
    location = /sitemap.xml {
        set $gw http://gateway-api:8765;
        proxy_pass $gw/souls-guide-api/sitemap.xml;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    # O PUT do arquivo vai direto para a storage-api, fora do gateway — é o desenho da
    # URL assinada. Como a assinatura vem sem host (STORAGE_LOCAL_BASE_URL vazio), o
    # navegador resolve contra a origem atual e cai aqui.
    location ^~ /local-upload/ { set $st http://storage-api:8096; proxy_pass $st$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }
    location ^~ /local-files/  { set $st http://storage-api:8096; proxy_pass $st$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }

    # ── Front ───────────────────────────────────────────────────────────────────
    # O index.html é o único arquivo sem hash no nome, e é ele que diz qual
    # main-XXXX.js carregar. Cacheado, o navegador continua pedindo os chunks do
    # build anterior — que o deploy novo apagou — e a tela morre em 404 de chunk,
    # sem erro nenhum no servidor. Foi o que aconteceu: sem Cache-Control
    # explícito o navegador aplica cache heurístico, e os .js ao lado estavam
    # marcados como immutable por um ano.
    #
    # `=` tem prioridade máxima no nginx, então este bloco ganha da regex de
    # assets abaixo, e o try_files do SPA cai aqui pelo redirecionamento interno.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # O service worker e o manifesto dele não podem ser cacheados como os bundles.
    #
    # O nome dos dois não tem hash — são eles que **dizem** qual bundle é o atual. A regex
    # de assets logo abaixo casa `.js` e marca um ano com `immutable`, o que congelaria o
    # `ngsw-worker.js` do dia da instalação: o navegador nunca mais buscaria um novo, e o
    # app pararia de atualizar para sempre, sem erro nenhum. `=` ganha da regex.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # O que existe em disco sai daqui (bundle, imagem, robots.txt); o resto é HTML, e
    # quem monta HTML é o servidor de SSR.
    #
    # Antes esta linha era `try_files $uri $uri/ /index.html` — o index.html vazio, para
    # o navegador preencher. Era isso que fazia todo link compartilhado aparecer no
    # Discord como "Soulguide" e mais nada: o crawler de preview não executa JavaScript,
    # e o que ele lia era a casca.
    location / {
        try_files $uri @ssr;
    }

    location @ssr {
        set $ssr http://soulguide-ssr:4000;
        proxy_pass $ssr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Os cabeçalhos de proxy são apagados de propósito. O servidor de SSR não deriva
        # nada deles — a base da API vem de SSR_API_BASE e o domínio canônico de
        # SITE_URL —, e o @angular/ssr avisa no log a cada requisição que chega com um
        # deles sem `trustProxyHeaders` configurado. Apagar aqui é dizer, no lugar certo,
        # que a decisão é não confiar.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";

        # SSR busca dado de outros serviços antes de responder. O padrão de 60s é o que
        # separa "a página demorou" de "o gateway caiu".
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Cache de assets com hash no nome (gerados pelo Angular). O hash muda a cada
    # build, então o nome novo é o que invalida — não a expiração.
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}

# Resolver do Docker. Sem ele, o nginx resolve os nomes dos containers uma única vez na
# subida e morre com "host not found in upstream" se o gateway ainda não existir —
# exatamente o que acontece quando a máquina reinicia e todos os containers voltam juntos.
# Com resolver + variável no proxy_pass, o nome é resolvido a cada requisição.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload de imagem passa por aqui; o padrão do nginx (1MB) recusaria print de jogo.
    client_max_body_size 25m;

    # ── Proxy das APIs ──────────────────────────────────────────────────────────
    # O front chama /souls-guide-api/... em vez de http://localhost:8765/souls-guide-api/...
    # justamente para que quem serve o HTML também sirva a API: mesma origem, sem CORS,
    # e o mesmo build funciona em localhost, no IP da LAN e na URL do túnel.
    #
    # O `^~` não é enfeite: sem ele o nginx ainda avalia as regex depois do prefixo, e a
    # regex de cache de assets lá embaixo casa qualquer caminho terminado em .webp/.png —
    # inclusive a URL assinada de upload. O PUT caía no handler de arquivo estático, que
    # só aceita GET/HEAD, e voltava 405 sem nunca chegar na storage-api.
    location ^~ /souls-guide-api/  { set $gw http://gateway-api:8765; proxy_pass $gw$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }
    location ^~ /authorization-api/ { set $gw http://gateway-api:8765; proxy_pass $gw$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }
    location ^~ /user-api/          { set $gw http://gateway-api:8765; proxy_pass $gw$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }
    location ^~ /storage-api/       { set $gw http://gateway-api:8765; proxy_pass $gw$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }

    # O PUT do arquivo vai direto para a storage-api, fora do gateway — é o desenho da
    # URL assinada. Como a assinatura vem sem host (STORAGE_LOCAL_BASE_URL vazio), o
    # navegador resolve contra a origem atual e cai aqui.
    location ^~ /local-upload/ { set $st http://storage-api:8096; proxy_pass $st$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }
    location ^~ /local-files/  { set $st http://storage-api:8096; proxy_pass $st$request_uri; include /etc/nginx/conf.d/proxy-comum.inc; }

    # ── Front ───────────────────────────────────────────────────────────────────
    # Angular SPA — todas as rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets com hash no nome (gerados pelo Angular)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}

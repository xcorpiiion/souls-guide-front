@if (auth.isLoggedIn()) {
  <button class="report__botao" type="button" (click)="abrir()" aria-label="denunciar conteúdo">
    <i class="ti ti-flag" aria-hidden="true"></i> denunciar
  </button>
}

@if (aberto()) {
  <!--
    Botão, e não div: fechar clicando fora precisa existir também para quem navega por
    teclado, e um div com (click) é alcançável só pelo mouse.
  -->
  <button class="report__fundo" type="button" aria-label="fechar" (click)="fechar()"></button>

  <div class="report__caixa" role="dialog" aria-label="denunciar conteúdo">
    <h2 class="report__titulo">o que há de errado?</h2>

    <div class="report__motivos">
      @for (r of reasons; track r) {
        <button
          class="report__motivo"
          type="button"
          [class.report__motivo--ativo]="motivo() === r"
          (click)="motivo.set(r)"
        >
          {{ reasonLabel[r] }}
        </button>
      }
    </div>

    <label class="report__label" for="report-detalhes">detalhes (opcional)</label>
    <textarea
      id="report-detalhes"
      class="report__texto"
      rows="3"
      maxlength="1000"
      placeholder="o que a moderação precisa saber para decidir"
      [ngModel]="detalhes()"
      (ngModelChange)="detalhes.set($event)"
    ></textarea>

    <p class="report__aviso">
      a denúncia vai para uma fila e é lida por uma pessoa — nada é removido automaticamente.
    </p>

    <div class="report__acoes">
      <button class="report__cancelar" type="button" (click)="fechar()">cancelar</button>
      <button class="report__enviar" type="button" [disabled]="enviando()" (click)="enviar()">
        @if (enviando()) {
          enviando…
        } @else {
          enviar denúncia
        }
      </button>
    </div>
  </div>
}

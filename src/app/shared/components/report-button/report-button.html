@if (auth.isLoggedIn()) {
  <button
    class="report__botao"
    type="button"
    (click)="abrir()"
    [attr.aria-label]="'acao.denunciar' | t"
  >
    <i class="ti ti-flag" aria-hidden="true"></i> {{ 'acao.denunciar' | t }}
  </button>
}

@if (aberto()) {
  <!--
    Botão, e não div: fechar clicando fora precisa existir também para quem navega por
    teclado, e um div com (click) é alcançável só pelo mouse.
  -->
  <button class="report__fundo" type="button" aria-label="fechar" (click)="fechar()"></button>

  <div class="report__caixa" role="dialog" aria-label="denunciar conteúdo">
    <h2 class="report__titulo">{{ 'denuncia.titulo' | t }}</h2>

    <div class="report__motivos">
      @for (r of reasons; track r) {
        <button
          class="report__motivo"
          type="button"
          [class.report__motivo--ativo]="motivo() === r"
          (click)="motivo.set(r)"
        >
          {{ reasonLabel[r] }}
        </button>
      }
    </div>

    <label class="report__label" for="report-detalhes">{{ 'denuncia.detalhes' | t }}</label>
    <textarea
      id="report-detalhes"
      class="report__texto"
      rows="3"
      maxlength="1000"
      [placeholder]="'denuncia.detalhesPlaceholder' | t"
      [ngModel]="detalhes()"
      (ngModelChange)="detalhes.set($event)"
    ></textarea>

    <p class="report__aviso">
      {{ 'denuncia.aviso' | t }}
    </p>

    <div class="report__acoes">
      <button class="report__cancelar" type="button" (click)="fechar()">
        {{ 'acao.cancelar' | t }}
      </button>
      <button class="report__enviar" type="button" [disabled]="enviando()" (click)="enviar()">
        @if (enviando()) {
          {{ 'denuncia.enviando' | t }}
        } @else {
          {{ 'denuncia.enviar' | t }}
        }
      </button>
    </div>
  </div>
}
